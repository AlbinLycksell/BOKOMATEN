<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand · Photography direction</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 28px; background: var(--linne); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .frame { aspect-ratio: 3/2; border-radius: 8px; overflow: hidden; position: relative; }
  .f1 { background: linear-gradient(135deg, #3D4D5C, #1B2D40); }
  .f2 { background: linear-gradient(170deg, #C2966B 0%, #8C5C3A 50%, #2A1F15 100%); }
  .tag { position: absolute; left: 12px; bottom: 10px; right: 12px; color: #F4EFE6; font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: -0.005em; line-height: 1.3; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .accent { width: 4px; height: 30px; background: var(--signal); position: absolute; left: 0; bottom: 8px; border-radius: 2px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: rgba(244,239,230,0.7); letter-spacing: 0.08em; text-transform: uppercase; position: absolute; left: 12px; top: 12px; }
  .caption { font-size: 12px; color: var(--fg-muted); margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body class="verkstad">
  <div class="grid">
    <div>
      <div class="frame f1">
        <div class="meta">PLACEHOLDER · 06:30 morning</div>
        <div class="accent"></div>
        <div class="tag" style="padding-left: 14px;">Panelbil dashboard. iPhone in magnetic holder. Frost on windscreen.</div>
      </div>
      <div class="caption">Cold blue-grey · January light · Bromma</div>
    </div>
    <div>
      <div class="frame f2">
        <div class="meta">PLACEHOLDER · amber kök 06:30</div>
        <div class="accent"></div>
        <div class="tag" style="padding-left: 14px;">Hand on kaffekopp. iPad propped against jar. Bahco wrench on faktura.</div>
      </div>
      <div class="caption">Warm amber · summer afternoon · Skellefteå</div>
    </div>
  </div>
</body>
</html>
