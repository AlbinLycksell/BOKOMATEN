<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Color · Neutral ramp</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--linne); font-family: var(--font-body); color: var(--fg); padding: 22px 24px; }
  .note { font-size: 13px; color: var(--fg-muted); margin-bottom: 12px; max-width: 640px; line-height: 1.5; }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .step { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #fff; }
  .chip { height: 72px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 500; color: var(--fg-strong); }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="note">Five-step neutral ramp + ink + linne, tuned <em>warm</em> — a hint of yellow in the gray, never blue. The product UI's secondary text, dividers, disabled states.</div>
  <div class="ramp">
    <div class="step"><div class="chip" style="background:#FBF8F2"></div><div class="meta"><div class="name">linne</div><div class="hex">#FBF8F2</div></div></div>
    <div class="step"><div class="chip" style="background:#F5F0E5"></div><div class="meta"><div class="name">grey-50</div><div class="hex">#F5F0E5</div></div></div>
    <div class="step"><div class="chip" style="background:#E4DDCD"></div><div class="meta"><div class="name">grey-100</div><div class="hex">#E4DDCD</div></div></div>
    <div class="step"><div class="chip" style="background:#A89E8A"></div><div class="meta"><div class="name">grey-300</div><div class="hex">#A89E8A</div></div></div>
    <div class="step"><div class="chip" style="background:#5E5749"></div><div class="meta"><div class="name">grey-500</div><div class="hex" style="color:#E4DDCD">#5E5749</div></div></div>
    <div class="step"><div class="chip" style="background:#3A3528"></div><div class="meta"><div class="name">grey-700</div><div class="hex">#3A3528</div></div></div>
    <div class="step"><div class="chip" style="background:#14110B"></div><div class="meta"><div class="name">ink</div><div class="hex">#14110B</div></div></div>
  </div>
</body>
</html>
