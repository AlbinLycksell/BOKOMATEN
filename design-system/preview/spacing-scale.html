<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing · 4px scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--linne); font-family: var(--font-body); color: var(--fg); padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 90px 60px 1fr; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--fg-strong); }
  .num  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); text-align: right; }
  .bar  { height: 16px; background: var(--havsbla); border-radius: 4px; }
</style>
</head>
<body>
  <div class="row"><div class="name">--s-1</div><div class="num">4px</div><div><div class="bar" style="width:4px"></div></div></div>
  <div class="row"><div class="name">--s-2</div><div class="num">8px</div><div><div class="bar" style="width:8px"></div></div></div>
  <div class="row"><div class="name">--s-3</div><div class="num">12px</div><div><div class="bar" style="width:12px"></div></div></div>
  <div class="row"><div class="name">--s-4</div><div class="num">16px</div><div><div class="bar" style="width:16px"></div></div></div>
  <div class="row"><div class="name">--s-6</div><div class="num">24px</div><div><div class="bar" style="width:24px"></div></div></div>
  <div class="row"><div class="name">--s-8</div><div class="num">32px</div><div><div class="bar" style="width:32px"></div></div></div>
  <div class="row"><div class="name">--s-12</div><div class="num">48px</div><div><div class="bar" style="width:48px"></div></div></div>
  <div class="row"><div class="name">--s-16</div><div class="num">64px</div><div><div class="bar" style="width:64px"></div></div></div>
  <div class="row"><div class="name">--s-24</div><div class="num">96px</div><div><div class="bar" style="width:96px"></div></div></div>
  <div class="row"><div class="name">--s-32</div><div class="num">128px</div><div><div class="bar" style="width:128px"></div></div></div>
</body>
</html>
