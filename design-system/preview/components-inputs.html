<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Components · Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 28px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .lbl { font-size: 13px; color: var(--fg-strong); font-weight: 500; }
  .help { font-size: 12px; color: var(--fg-muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .focus { /* shadow removed */ border-color: var(--havsbla) !important; }
</style>
</head>
<body class="verkstad">
  <div class="grid">
    <div>
      <div class="field"><label class="lbl">Företagsnamn</label><input class="v-input" value="Magnus VVS AB"/></div>
      <div class="field"><label class="lbl">Org.nr</label><input class="v-input v-tnum focus" value="556987-1234"/><span class="help">Hämtar uppgifter från Bolagsverket.</span></div>
    </div>
    <div>
      <div class="field"><label class="lbl">Telefonnummer som vidarekopplas</label><input class="v-input v-tnum" value="070-512 44 19"/></div>
      <div class="field"><label class="lbl">Jourtekniker</label>
        <select class="v-input"><option>Alex Bergström</option><option>Magnus Lindgren</option></select>
      </div>
    </div>
  </div>
</body>
</html>
