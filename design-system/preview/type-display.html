<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--linne); font-family: var(--font-body); color: var(--fg); padding: 22px 28px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .specimen { font-family: var(--font-display); color: var(--fg-strong); letter-spacing: -0.025em; line-height: 1.02; font-weight: 600; }
  .row + .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .a { color: var(--signal); }
</style>
</head>
<body>
  <div class="row">
    <div class="label">Display XL · 96–144px · marketing hero</div>
    <div class="specimen" style="font-size: 88px;">Magnus missar inga <span class="a">akutsamtal</span></div>
  </div>
  <div class="row">
    <div class="label">Display L · 64–96px · section starter</div>
    <div class="specimen" style="font-size: 56px;">Du behöver inte stanna mitt i jobbet</div>
  </div>
</body>
</html>
