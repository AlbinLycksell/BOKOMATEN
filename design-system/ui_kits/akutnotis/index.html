<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<title>Switchboard · Akutnotis</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  body { margin: 0; background: var(--linne-deep); min-height: 100vh; padding: 32px 24px 48px; }
  .stage { max-width: 1200px; margin: 0 auto; }
  .stage-head { padding: 0 8px 24px; }
  .eye { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--fg-muted); }
  .h { font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg-strong); margin: 8px 0 8px; line-height: 1.1; }
  .lede { font-size: 15px; color: var(--fg); max-width: 64ch; line-height: 1.55; margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; align-items: start; }
  .frame-cap { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-muted); text-align: center; margin-top: -4px; }
  .control { padding: 16px 0 24px; display: flex; gap: 8px; justify-content: center; }
</style>
</head>
<body class="verkstad" data-screen-label="Mobile · Akutnotis">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="PhoneFrame.jsx"></script>
  <script type="text/babel" src="LockScreen.jsx"></script>
  <script type="text/babel" src="WatchFace.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [expanded, setExpanded] = React.useState(false);
      const [pulseKey, setPulseKey] = React.useState(0);
      return (
        <div className="stage">
          <div className="stage-head">
            <div className="eye">AKUTNOTIS · LOCK SCREEN + WATCH</div>
            <h2 className="h">Eight seconds, one decision.</h2>
            <p className="lede">
              Alex's evening. Kids in bed. The orange tells him, before he reads a word, what kind of message this is. The notification pulses once, then stillness.
            </p>
          </div>
          <div className="control">
            <button className="v-btn v-btn--secondary v-btn--sm" onClick={() => { setExpanded(false); setPulseKey(k => k+1); }}>↺ Replay pulse</button>
            <button className="v-btn v-btn--navy v-btn--sm" onClick={() => setExpanded(e => !e)}>{expanded ? "Collapse notification" : "Tap to expand"}</button>
          </div>
          <div className="row">
            <div>
              <PhoneFrame time="19:47">
                <LockScreen/>
              </PhoneFrame>
              <div className="frame-cap">Quiet — normal booking</div>
            </div>
            <div>
              <PhoneFrame key={pulseKey} time="19:47">
                <LockScreen akut expanded={expanded} onTap={() => setExpanded(e => !e)}/>
              </PhoneFrame>
              <div className="frame-cap">{expanded ? "Tapped — actions revealed" : "Akutnotis arrived — pulse 1×"}</div>
            </div>
            <div>
              <WatchFace/>
            </div>
          </div>
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
