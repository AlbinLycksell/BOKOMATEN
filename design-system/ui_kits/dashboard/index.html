<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<title>Switchboard · Briefing</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  body { margin: 0; background: var(--linne); }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  @keyframes v-fade { from { opacity: 0 } to { opacity: 1 } }
</style>
</head>
<body class="verkstad" data-screen-label="Dashboard · Briefing">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="SideNav.jsx"></script>
  <script type="text/babel" src="BriefingHeader.jsx"></script>
  <script type="text/babel" src="StatPanel.jsx"></script>
  <script type="text/babel" src="CallList.jsx"></script>
  <script type="text/babel" src="CallDetail.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [active, setActive] = React.useState(null);
      return (
        <div className="layout">
          <SideNav active="Briefing"/>
          <main>
            <BriefingHeader/>
            <div style={{padding: "28px 0 16px"}}>
              <StatPanel/>
            </div>
            <CallList onPick={setActive}/>
            {active && <CallDetail call={active} onClose={() => setActive(null)}/>}
          </main>
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
