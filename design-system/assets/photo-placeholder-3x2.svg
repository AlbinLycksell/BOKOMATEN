
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Photography placeholder">
  <defs>
    <linearGradient id="warmlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D4D5C"></stop>
      <stop offset="1" stop-color="#1B2D40"></stop>
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="rgba(255,255,255,0.012)"></rect>
      <circle cx="1.5" cy="1.5" r="0.4" fill="rgba(255,255,255,0.04)"></circle>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#warmlight)"></rect>
  <rect width="1200" height="800" fill="url(#grain)"></rect>
  <g transform="translate(60 660)" fill="#F4EFE6">
    <rect x="0" y="0" width="10" height="80" fill="#E25822"></rect>
    <text x="28" y="22" font-family="Geist, Söhne, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.08em" fill="#F4EFE6" opacity="0.7">PHOTOGRAPHY · PLACEHOLDER</text>
    <text x="28" y="50" font-family="Geist, Söhne, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#F4EFE6">Real Swedish hantverker-life. Natural light.</text>
    <text x="28" y="76" font-family="Geist, Söhne, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#F4EFE6" opacity="0.7">Replace with shot from production photographer brief.</text>
  </g>
</svg>