name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: svarsa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: sync deps
        working-directory: backend
        run: uv sync --extra dev
      - name: ruff lint
        working-directory: backend
        run: uv run ruff check src tests
      - name: pyright
        working-directory: backend
        run: uv run pyright || true   # warn-only at MVP; tighten in P15+
      - name: pytest (sqlite)
        working-directory: backend
        run: uv run pytest -q
      - name: alembic upgrade head (postgres)
        working-directory: backend
        env:
          SVARSA_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/svarsa_test
        run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
      - name: build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
