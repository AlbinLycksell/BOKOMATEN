name: gitleaks

# Defense-in-depth alongside the local pre-commit hook. Catches anything that
# bypassed the hook (--no-verify, fresh clone without `pre-commit install`,
# or a committed branch that wasn't scanned locally).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the scan covers all commits on the PR / push,
          # not just the tip.
          fetch-depth: 0

      - name: install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xzC /usr/local/bin gitleaks
          gitleaks version

      - name: scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner
