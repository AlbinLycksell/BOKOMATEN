name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: europe-west4
  SERVICE: switchboard-web
  IMAGE_BASE: europe-west4-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: configure docker auth
        run: gcloud auth configure-docker ${{ env.IMAGE_BASE }} --quiet

      - name: build and push
        run: |
          IMAGE="${IMAGE_BASE}/${{ secrets.GCP_PROJECT }}/switchboard/web:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" web
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --quiet
