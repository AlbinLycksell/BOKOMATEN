[project]
name = "svarsa-backend"
version = "0.1.0"
description = "Svarsa AI — Swedish voice receptionist for hantverkare. Backend services."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "google-genai>=1.0",
    "google-adk>=1.0",
    "websockets>=14",
    "numpy>=2.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "scipy>=1.14",
    "httpx>=0.28",
    "python-ulid>=3.0",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "anyio>=4.7",
]

[project.scripts]
dump-openapi = "svarsa.scripts.dump_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svarsa"]
