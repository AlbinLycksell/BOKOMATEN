# Pre-commit hooks for Switchboard.
# Install once: `pip install pre-commit && pre-commit install`
# Then every `git commit` runs the hooks below against staged files.
# Run manually against the whole repo: `pre-commit run --all-files`

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Uses .gitleaks.toml at repo root for project-specific allowlist.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
        # Skip Helm-style templating in CI workflows that uses ${{ ... }} —
        # check-yaml chokes on the !! sigils we don't actually use, but the
        # workflow files themselves parse cleanly through actions/checkout's
        # validation.
        exclude: '^\.github/workflows/'
      - id: end-of-file-fixer
        exclude: '^(web/lib/api-types\.ts|backend/openapi\.json|.*\.svg)$'
      - id: trailing-whitespace
        exclude: '^(web/lib/api-types\.ts|backend/openapi\.json)$'
